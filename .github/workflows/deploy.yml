
      - name: Validate Clerk production environment
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const file = ".vercel/.env.production.local";

          if (!fs.existsSync(file)) {
            console.error("Vercel production environment file is missing.");
            process.exit(1);
          }

          const content = fs.readFileSync(file, "utf8");

          const match = content.match(
            /^NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=(.*)$/m
          );

          if (!match) {
            console.error("Clerk publishable key is missing.");
            process.exit(1);
          }

          let key = match[1].trim();

          if (
            (key.startsWith('"') && key.endsWith('"')) ||
            (key.startsWith("'") && key.endsWith("'"))
          ) {
            key = key.slice(1, -1);
          }

          if (!/^pk_(test|live)_[A-Za-z0-9_-]+$/.test(key)) {
            console.error("Clerk publishable key has an invalid format.");
            process.exit(1);
          }

          console.log("Clerk publishable key format is valid.");
          NODE
