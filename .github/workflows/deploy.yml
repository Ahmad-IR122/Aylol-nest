name: Aylol Nest Deploy

on:
  workflow_run:
    workflows: ["Aylol Nest CI"]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify latest commit before build
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          LATEST_SHA=$(gh api \
            repos/${{ github.repository }}/git/ref/heads/main \
            --jq '.object.sha')

          if [ "$LATEST_SHA" != "$VERIFIED_SHA" ]; then
            echo "A newer commit exists on main."
            echo "Skipping outdated deployment."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment
        working-directory: ./app
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Install environment parser
        working-directory: ./app
        run: npm install --no-save --no-package-lock dotenv

      - name: Validate Clerk production environment
        working-directory: ./app
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const dotenv = require("dotenv");

          const file = ".vercel/.env.production.local";

          if (!fs.existsSync(file)) {
            console.error("Vercel production environment file is missing.");
            process.exit(1);
          }

          const env = dotenv.parse(fs.readFileSync(file));

          const publishableKey =
            env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY;

          const secretKey = env.CLERK_SECRET_KEY;

          if (!publishableKey?.startsWith("pk_live_")) {
            console.error(
              "Invalid or missing Clerk production publishable key."
            );
            process.exit(1);
          }

          if (!secretKey?.startsWith("sk_live_")) {
            console.error(
              "Invalid or missing Clerk production secret key."
            );
            process.exit(1);
          }

          console.log("Clerk production environment is valid.");
          NODE

      - name: Build production deployment
        working-directory: ./app
        run: |
          vercel build \
            --prod \
            --token="$VERCEL_TOKEN"

      - name: Verify latest commit before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          LATEST_SHA=$(gh api \
            repos/${{ github.repository }}/git/ref/heads/main \
            --jq '.object.sha')

          if [ "$LATEST_SHA" != "$VERIFIED_SHA" ]; then
            echo "A newer commit exists on main."
            echo "Skipping outdated deployment."
            exit 1
          fi

      - name: Deploy to production
        working-directory: ./app
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
